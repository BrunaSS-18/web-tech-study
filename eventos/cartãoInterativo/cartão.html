<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Muay Thai</h1>
    
    <div class="card">
        <img class="muayThai" src="Gemini_Generated_Image_oa4u33oa4u33oa4u.png">
        <p id="resposta"> O Muay Thai é uma arte marcial da Tailândia que usa oito partes do corpo como armas de ataque e defesa pessoal. </p>
        <button id="btnRevelar">Cadastre-se</button>

        <div class="form">
            <form>
                <article class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome"/>
                </article>

                <article class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email"/>
                </article>

                <article class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone"/>
                </article>

                <article class="form-button">
                    <button>Cadastrar</button>
                </article>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
